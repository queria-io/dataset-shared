name: vocab

on:
  pull_request:
    paths: ["vocab/**", "scripts/check-vocab.py", ".github/workflows/vocab.yml"]
  push:
    branches: [main]
    paths: ["vocab/**", "scripts/check-vocab.py", ".github/workflows/vocab.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # 語彙は公開データセット（gif・schemaorg）から引く。トークンはレートリミットを上げるためだけ
      - run: uv run scripts/check-vocab.py
        env:
          QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
