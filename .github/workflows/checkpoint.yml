name: Checkpoint (reusable)

on:
  workflow_call:
    inputs:
      s3_bucket:
        # fdl のリポだけが使う。queria に移ったリポでは何も指さないので、
        # 最後のリポが移り終わったら入力ごと外す
        required: false
        type: string
    secrets:
      # **`secrets: inherit` は所有者をまたがない。** 理由は sync.yml の同じ宣言を参照。
      QUERIA_TOKEN:
        description: 書き込み先のアカウントを決めるトークン
        required: false
      DISCORD_WEBHOOK_URL:
        description: 失敗の通知先。空なら通知しない
        required: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    # Sync と Checkpoint はどちらもカタログに push する。並行して走ると、後から
    # push した側が先の push の最中にカタログを変えてしまい、先の側が
    # "The dataset changed while this push was running" で落ちる。呼び出し側の
    # workflow レベル concurrency は Sync と Checkpoint をまたがないので、この
    # 2 つの job を同じ group に入れて直列化する。
    #
    # ここで直列化できるのは reusable を経由する job だけ。カタログに push する
    # 自前の job を持つリポジトリでは、その job にも同じ group を書く
    #
    # 走っている側は止めない。push の途中で切ると、公開されたカタログと
    # データファイルの対応が途中の状態で残る
    concurrency:
      group: queria-catalog-write
      cancel-in-progress: false
      # 既定の queue: single は pending を 1 つしか持てず、後から来た run が
      # 待っている run を蹴る。Checkpoint の cron は呼び出し側にあり週次か月次
      # なので、Sync の列に埋もれて二度と走らなくなる。待てる数を増やす
      queue: max
    env:
      # queria は誰のデータセットに書くのかをトークンから決める。R2 の鍵は渡さない
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      # 以下 4 つは移行前のリポのみ。最後のリポが移り終わったら外す
      FDL_S3_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      FDL_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      FDL_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      FDL_S3_BUCKET: ${{ inputs.s3_bucket }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      - name: Install dependencies
        run: |
          uv lock --upgrade-package queria
          uv sync

      # スナップショットの expire と、それが押さえていたデータファイルの削除。
      # 他に消せるものは無い: DuckLake は live なスナップショットが名前を持つ
      # ファイルを全部保持するので、ビルドして公開するだけのデータセットが際限なく増える。
      #
      # 手動の CHECKPOINT は使わない。inlined data を parquet に flush して
      # メモリを食い尽くし、肥大カタログで OOM クラッシュする (dataset-e-stat で発生)。
      #
      # 公開しないと expire の結果が読み手に見えないので push まで行う。push は
      # 既定で expire も行うため、明示的に expire したあとは --keep-history で二度回さない
      - name: Expire snapshots and publish
        run: |
          uv run queria pull
          uv run queria expire --retention-days 7
          uv run queria push --keep-history
