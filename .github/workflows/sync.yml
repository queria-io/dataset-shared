name: Sync (reusable)

on:
  workflow_call:
    inputs:
      dataset_name:
        # 呼び出し側が渡しているだけで、この workflow は使っていない。
        # 全リポの呼び出しから外したら、入力ごと外す
        required: false
        type: string
      runs-on:
        # 取得元が日本国外を弾くリポは self-hosted (国内) を渡す
        description: 実行するランナー
        required: false
        type: string
        default: ubuntu-latest
      node_version:
        # ビルドが Node のツールを呼ぶリポだけが渡す。省略時は Node を用意しない
        # (ランナー標準の Node はイメージ更新で上がるので、要るリポは版を明示する)
        description: 用意する Node.js のバージョン
        required: false
        type: string
      timeout_minutes:
        # 既定は軽いデータセットに合わせてある。直近の成功ランの実測で 21 リポのうち
        # 14 が 5 分以内、最も重い jma / metro_tokyo が 33 分・38 分。これを超える
        # データセットは自分の実測値を渡す (値の一覧は README)
        #
        # 数えるのは job が走り出してからの時間で、concurrency の待ち時間は入らない
        # (dataset-e-stat の run 34814706853 は 161 分待ってから 210 分走って成功した)
        description: sync job を打ち切るまでの分数
        required: false
        type: number
        default: 90
      free_disk:
        # fdl は data.queria.io に上げる前にデータファイルを手元に書くので、ビルドが
        # 書く量だけディスクが要る。書く量がランナーの空きに近い
        # データセット (overturemaps は 1 回に約 25GB) は、使わないツールを消して空ける
        description: ビルドの前に、ランナーに入っている使わないツールを消してディスクを空ける
        required: false
        type: boolean
        default: false
    secrets:
      # **`secrets: inherit` は所有者をまたがない。** GitHub の仕様で、inherit が効くのは
      # 呼び出し側と同じ organization / enterprise の reusable workflow を呼ぶときだけ。
      # 個人アカウントのリポジトリからこの workflow を呼ぶと、inherit を書いても
      # secrets は空で渡り、queria が「トークンが無い」として落ちる。
      # 明示的に渡せるように宣言する。org のリポジトリも inherit は使わず、使うものだけを渡す
      # (inherit は宣言の有無にかかわらず、そのリポジトリのシークレットを全部渡す)。
      QUERIA_TOKEN:
        description: 書き込み先のアカウントを決めるトークン
        required: false
      DISCORD_WEBHOOK_URL:
        description: 失敗の通知先。空なら通知しない
        required: false
      ESTAT_API_KEY:
        description: e-Stat API のアプリケーション ID
        required: false
      REINFOLIB_API_KEY:
        description: 不動産情報ライブラリ API のキー
        required: false
      EDINET_API_KEY:
        description: EDINET API のキー
        required: false

jobs:
  sync:
    runs-on: ${{ inputs.runs-on }}
    # 置かないとランナー既定の 360 分まで走る。取得元が応答を返さなくなったときに
    # 6 時間ぶん走り切ってから打ち切られ、そのあいだ同じ concurrency group の
    # Checkpoint も止まる
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Sync と Checkpoint はどちらもカタログに push する。並行して走ると、後から
    # push した側が先の push の最中にカタログを変えてしまい、先の側が
    # "The dataset changed while this push was running" で落ちる。呼び出し側の
    # workflow レベル concurrency は Sync と Checkpoint をまたがないので、この
    # 2 つの job を同じ group に入れて直列化する。
    #
    # ここで直列化できるのは reusable を経由する job だけ。カタログに push する
    # 自前の job を持つリポジトリでは、その job にも同じ group を書く
    #
    # 走っている側は止めない。push の途中で切ると、公開されたカタログと
    # データファイルの対応が途中の状態で残る
    concurrency:
      group: queria-catalog-write
      cancel-in-progress: false
      # 既定の queue: single は pending を 1 つしか持てず、後から来た run が
      # 待っている run を蹴る。Checkpoint の cron は呼び出し側にあり週次か月次
      # なので、Sync の列に埋もれて二度と走らなくなる。待てる数を増やす
      queue: max
    env:
      PYTHONUNBUFFERED: "1"
      # queria は誰のデータセットに書くのかをトークンから決める。R2 の鍵は渡さない
      # (一時認証情報を queria が取り、それも値ではなく取り方だけがビルドに渡る)
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      # fdl で上げるリポ (scripts/build-fdl.sh) は同じトークンで data.queria.io に書く。
      # 呼び出し側が `id-token: write` を渡すと、build-fdl.sh はこれを使わず OIDC で
      # 1 時間のトークンを取る (scripts/queria_token.py)。permissions をここに書くと、
      # 渡していない呼び出し側の run が起動時に落ちるので書かない
      FDL_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
    steps:
      - name: Free disk space
        if: inputs.free_disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      - uses: actions/setup-node@v7
        if: inputs.node_version != ''
        with:
          node-version: ${{ inputs.node_version }}

      # queria と fdl はベータ開発中なので、常に最新版を使用する
      # (依存に無いほうの指定は uv が無視する)
      - name: Install dependencies
        run: |
          uv lock --upgrade-package queria --upgrade-package fdl-cli
          uv sync

      - name: Build and push
        run: scripts/build.sh

  notify-failure:
    runs-on: ubuntu-latest
    needs: sync
    # **`failure()` は timeout-minutes の打ち切りを拾わない。** 打ち切られた job の
    # 結果は cancelled で、そのとき `failure()` も `cancelled()` も false を返すので、
    # `failure()` でも `failure() || cancelled()` でもこの job は skip される。
    # 結果を直接見る (実測: dataset-shared の run 36202940197 / 36203435566)
    #
    # `!cancelled()` が人の手によるキャンセルと打ち切りを分ける。人が run を止めた
    # ときはこの job も一緒にキャンセルされて通知は飛ばない。job が timeout で
    # 打ち切られたときは run にキャンセルが来ていないので、この job は走る
    if: ${{ !cancelled() && needs.sync.result != 'success' && needs.sync.result != 'skipped' }}
    steps:
      - name: Notify Discord
        # **通知先が無いときは黙って終わる。** 空の URL を curl に渡すと exit 3 で
        # この job まで失敗し、Actions の一覧で本当の失敗理由が隠れる
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ needs.sync.result }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          # 打ち切りと失敗はどちらもここに来る。どちらだったかは題と Result に出す。
          # 打ち切りは取得元が応答を返さなくなったことを、失敗はビルドが落ちたことを指す
          if [ "$RESULT" = cancelled ]; then
            TITLE="Sync Timed Out"
          else
            TITLE="Sync Failed"
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"$TITLE\", \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"color\": 15158332, \"fields\": [{\"name\": \"Repository\", \"value\": \"${{ github.repository }}\"}, {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\"}, {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\"}, {\"name\": \"Result\", \"value\": \"$RESULT\"}]}]}" \
            "$WEBHOOK"
