name: Sync (reusable)

on:
  workflow_call:
    inputs:
      dataset_name:
        # 呼び出し側が渡しているだけで、この workflow は使っていない。
        # 全リポの呼び出しから外したら、入力ごと外す
        required: false
        type: string
      s3_bucket:
        # fdl のリポだけが使う。queria に移ったリポでは何も指さないので、
        # 最後のリポが移り終わったら入力ごと外す
        required: false
        type: string
      runs-on:
        # 取得元が日本国外を弾くリポは self-hosted (国内) を渡す
        description: 実行するランナー
        required: false
        type: string
        default: ubuntu-latest
      node_version:
        # ビルドが Node のツールを呼ぶリポだけが渡す。省略時は Node を用意しない
        # (ランナー標準の Node はイメージ更新で上がるので、要るリポは版を明示する)
        description: 用意する Node.js のバージョン
        required: false
        type: string
    secrets:
      # **`secrets: inherit` は所有者をまたがない。** GitHub の仕様で、inherit が効くのは
      # 呼び出し側と同じ organization / enterprise の reusable workflow を呼ぶときだけ。
      # 個人アカウントのリポジトリからこの workflow を呼ぶと、inherit を書いても
      # secrets は空で渡り、queria が「トークンが無い」として落ちる。
      # 明示的に渡せるように宣言する。org のリポジトリは inherit のままでよい
      # (inherit は宣言の有無にかかわらず全部渡す)。
      QUERIA_TOKEN:
        description: 書き込み先のアカウントを決めるトークン
        required: false
      DISCORD_WEBHOOK_URL:
        description: 失敗の通知先。空なら通知しない
        required: false

jobs:
  sync:
    runs-on: ${{ inputs.runs-on }}
    # Sync と Checkpoint はどちらもカタログに push する。並行して走ると、後から
    # push した側が先の push の最中にカタログを変えてしまい、先の側が
    # "The dataset changed while this push was running" で落ちる。呼び出し側の
    # workflow レベル concurrency は Sync と Checkpoint をまたがないので、この
    # 2 つの job を同じ group に入れて直列化する。
    #
    # ここで直列化できるのは reusable を経由する job だけ。カタログに push する
    # 自前の job を持つリポジトリでは、その job にも同じ group を書く
    #
    # 走っている側は止めない。push の途中で切ると、公開されたカタログと
    # データファイルの対応が途中の状態で残る
    concurrency:
      group: queria-catalog-write
      cancel-in-progress: false
      # 既定の queue: single は pending を 1 つしか持てず、後から来た run が
      # 待っている run を蹴る。Checkpoint の cron は呼び出し側にあり週次か月次
      # なので、Sync の列に埋もれて二度と走らなくなる。待てる数を増やす
      queue: max
    env:
      PYTHONUNBUFFERED: "1"
      # queria は誰のデータセットに書くのかをトークンから決める。R2 の鍵は渡さない
      # (一時認証情報を queria が取り、それも値ではなく取り方だけがビルドに渡る)
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
      # 以下 3 つは移行前のリポのみ。最後のリポが移り終わったら外す
      FDL_S3_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      FDL_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      FDL_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      FDL_S3_BUCKET: ${{ inputs.s3_bucket }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}
      REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      - uses: actions/setup-node@v7
        if: inputs.node_version != ''
        with:
          node-version: ${{ inputs.node_version }}

      # queria はベータ開発中なので、常に最新版を使用する
      - name: Install dependencies
        run: |
          uv lock --upgrade-package queria
          uv sync

      - name: Build and push
        run: scripts/build.sh

  notify-failure:
    runs-on: ubuntu-latest
    needs: sync
    # **`failure()` は timeout-minutes の打ち切りを拾わない。** 打ち切られた job の
    # 結果は cancelled で、そのとき `failure()` も `cancelled()` も false を返すので、
    # `failure()` でも `failure() || cancelled()` でもこの job は skip される。
    # 結果を直接見る (実測: dataset-shared の run 36202940197 / 36203435566)
    #
    # `!cancelled()` が人の手によるキャンセルと打ち切りを分ける。人が run を止めた
    # ときはこの job も一緒にキャンセルされて通知は飛ばない。job が timeout で
    # 打ち切られたときは run にキャンセルが来ていないので、この job は走る
    if: ${{ !cancelled() && needs.sync.result != 'success' && needs.sync.result != 'skipped' }}
    steps:
      - name: Notify Discord
        # **通知先が無いときは黙って終わる。** 空の URL を curl に渡すと exit 3 で
        # この job まで失敗し、Actions の一覧で本当の失敗理由が隠れる
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULT: ${{ needs.sync.result }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          # 打ち切りと失敗はどちらもここに来る。どちらだったかは題と Result に出す。
          # 打ち切りは取得元が応答を返さなくなったことを、失敗はビルドが落ちたことを指す
          if [ "$RESULT" = cancelled ]; then
            TITLE="Sync Timed Out"
          else
            TITLE="Sync Failed"
          fi
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"$TITLE\", \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"color\": 15158332, \"fields\": [{\"name\": \"Repository\", \"value\": \"${{ github.repository }}\"}, {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\"}, {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\"}, {\"name\": \"Result\", \"value\": \"$RESULT\"}]}]}" \
            "$WEBHOOK"
