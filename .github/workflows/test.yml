name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # fetch.py は標準ライブラリだけで書いているので、プロジェクトの依存は入れない
      - run: uv run --no-project --python 3.13 --with pyyaml python -m unittest discover -s tests -v
