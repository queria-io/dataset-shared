name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # fetch.py は標準ライブラリだけで書いているので、プロジェクトの依存は入れない
      - run: uv run --no-project --python 3.13 --with pyyaml --with duckdb --with pymupdf --with dbt-duckdb --with fdl-cli python -m unittest discover -s tests -v

  # dataset-shared の main は、各データセットが次の Apply で使う (各リポは `@main` で呼ぶ)。
  # マージの前に、このコミットで代表のデータセットを手元の fdl リポジトリに 2 回ビルドする。
  # 1 回目で apply と main を作り、2 回目で apply を main に取り込む。Queria には書かない
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # imi: Python で取得して dbt でビルドする。schemaorg: shared.fetch で取得する
        dataset: [imi, schemaorg]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: queria-io/dataset-${{ matrix.dataset }}
          path: dataset
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: dataset/shared
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - name: Build twice into a local fdl repository
        working-directory: dataset
        env:
          FDL_AUTHOR: test
        run: |
          uv sync
          remote="$RUNNER_TEMP/remote"
          mkdir -p "$remote"
          uv run fdl init "$remote"
          for run in 1 2; do
            FDL_REMOTE="$remote/" scripts/build.sh
          done
          uv run fdl log "$remote/" --ref refs/heads/main
